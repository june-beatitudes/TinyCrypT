[binaries]
c = ['mipsel-linux-muslsf-gcc']
ar = ['mipsel-linux-muslsf-gcc-ar']
ranlib = ['mipsel-linux-muslsf-gcc-ranlib']

[host_machine]
system = 'unknown'
cpu_family = 'mips'
cpu = 'r5900'
endian = 'little'

[built-in options]
c_args = ['-march=r5900', '-mabi=32']
c_link_args = ['-march=r5900', '-mabi=32']

[project options]
simd = 'none'
memconstrained = true
