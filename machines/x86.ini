[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
lib = ['zig', 'lib']
dlltool = ['zig', 'dlltool']

[built-in options]
c_args = ['-target', 'x86-linux-musl', '-m32']
c_link_args = ['-target', 'x86-linux-musl', '-m32']

[project options]
simd = '128-bit'
memconstrained = false
