[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
lib = ['zig', 'lib']
dlltool = ['zig', 'dlltool']

[host_machine]
system = 'unknown'
cpu_family = 'powerpc'
cpu = 'pwr4'
endian = 'big'

[built-in options]
c_args = ['-target', 'powerpc64-freestanding-none', '-mcpu=pwr5', '-mno-altivec']
cpp_args = ['-target', 'powerpc64-freestanding-none', '-mcpu=pwr5', '-mno-altivec']

[project options]
simd = 'none'
memconstrained = true
