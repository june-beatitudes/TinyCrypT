[binaries]
c = ['zig', 'cc', ]
cpp = ['zig', 'c++', '-target', 'arm-freestanding-none']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
lib = ['zig', 'lib']
dlltool = ['zig', 'dlltool']

[host_machine]
system = 'unknown'
cpu_family = 'arm'
cpu = 'cortex_a32'
endian = 'little'

[built-in options]
c_args = ['-target', 'arm-freestanding-none', '-mcpu=cortex_a32']
c_link_args = ['-target', 'arm-freestanding-none', '-mcpu=cortex_a32']

[project options]
simd = '128-bit'
memconstrained = true
