[binaries]
c = ['mipsel-linux-musl-gcc']
cpp = ['mipsel-linux-musl-g++']
ar = ['mipsel-linux-musl-ar']
ranlib = ['mipsel-linux-musl-ranlib']
lib = ['mipsel-linux-musl-lib']
dlltool = ['mipsel-linux-musl-dlltool']

[host_machine]
system = 'unknown'
cpu_family = 'mips'
cpu = 'r5900'
endian = 'little'

[built-in options]
c_args = ['-march=r5900', '-msoft-float']
cpp_args = ['-march=r5900', '-msoft-float']

[project options]
simd = 'none'
memconstrained = true
