[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
lib = ['zig', 'lib']
dlltool = ['zig', 'dlltool']

[host_machine]
system = 'unknown'
cpu_family = 'powerpc'
cpu = '750'
endian = 'big'

[built-in options]
c_args = ['-target', 'powerpc-freestanding-none', '-mcpu=750']
c_link_args = ['-target', 'powerpc-freestanding-none', '-mcpu=750']

[project options]
simd = 'none'
memconstrained = true
