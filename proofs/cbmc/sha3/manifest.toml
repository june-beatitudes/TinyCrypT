[general]
sources_under_test = ["tinycrypt/portable/sha3.c"]
apply_loop_contracts = true
cflags = ""

[proofs.tct_shake_absorb]
object_bits = 9
enforce = ["tct_shake_absorb"]
replace = ["tct_shake_init", "tct_shake_full", "tct_shake_squeeze_destructive"]

[proofs.tct_shake_init]
object_bits = 8
enforce = ["tct_shake_init"]
replace = [
  "tct_shake_absorb",
  "tct_shake_full",
  "tct_shake_squeeze_destructive",
]

[proofs.tct_shake_squeeze_destructive]
object_bits = 10
enforce = ["tct_shake_squeeze_destructive"]
replace = ["tct_shake_absorb", "tct_shake_full", "tct_shake_init"]

[proofs.tct_shake_full]
object_bits = 12
enforce = ["tct_shake_full"]
replace = [
  "tct_shake_init",
  "tct_shake_absorb",
  "tct_shake_squeeze_destructive",
]
